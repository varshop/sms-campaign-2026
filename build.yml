name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # المستودع لا يحتوي مجلد android الكامل، فنولّده ونحتفظ بملفاتنا (lib / pubspec / AndroidManifest)
      - name: Generate Android platform (if missing)
        run: |
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ]; then
            mkdir -p /tmp/backup
            cp -r lib pubspec.yaml /tmp/backup/
            if [ -f android/app/src/main/AndroidManifest.xml ]; then
              cp android/app/src/main/AndroidManifest.xml /tmp/backup/AndroidManifest.xml
            fi
            flutter create --org com.example --project-name sms_campaign --platforms android .
            rm -rf lib pubspec.yaml test
            cp -r /tmp/backup/lib /tmp/backup/pubspec.yaml .
            if [ -f /tmp/backup/AndroidManifest.xml ]; then
              cp /tmp/backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            fi
          fi

      - name: Set minSdk to 23
        run: |
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            [ -f "$f" ] || continue
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 23/' "$f"
          done

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sms-campaign-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
