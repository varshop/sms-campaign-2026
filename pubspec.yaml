name: sms_campaign
description: إرسال رسائل SMS مجدولة للعملاء من ملف Excel/CSV
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  file_picker: ^8.1.2            # اختيار ملف Excel / CSV
  excel: ^4.0.6                  # قراءة ملفات xlsx
  csv: ^6.0.0                    # قراءة ملفات csv
  permission_handler: ^11.3.1    # طلب صلاحية SMS والإشعارات
  another_telephony: ^0.4.1      # إرسال SMS فعلي من خط الهاتف
  flutter_background_service: ^5.1.0  # خدمة تعمل في الخلفية
  shared_preferences: ^2.3.2     # حفظ حالة الحملة

flutter:
  uses-material-design: true
